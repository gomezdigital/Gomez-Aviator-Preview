name: GameData365 Aviator live-feed check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test (preview development branch)
        required: true
        default: fix/restore-preview-research-core
        type: string
      sync_to_collector:
        description: Import the provider history into Render and Supabase (requires INGEST_API_TOKEN Actions secret)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out selected preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate research engine and preview UI
        run: node --check research-core.js && node --test research-core.test.js && node --test preview-ui.test.js && node --check v2-preview.js && node --check live-data.js
      - name: Run collector syntax checks and tests
        working-directory: collector
        run: npm run check && npm test
      - name: Check GameData365 live Aviator feed
        working-directory: collector
        env:
          GAMEDATA365_API_KEY: ${{ secrets.GAMEDATA365_API_KEY }}
        run: npm run probe:gamedata365
      - name: Check GameData365 Aviator history access
        working-directory: collector
        env:
          GAMEDATA365_API_KEY: ${{ secrets.GAMEDATA365_API_KEY }}
        run: npm run probe:gamedata365-history

  sync:
    if: ${{ inputs.sync_to_collector }}
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out selected preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import provider history into collector
        working-directory: collector
        env:
          GAMEDATA365_API_KEY: ${{ secrets.GAMEDATA365_API_KEY }}
          COLLECTOR_URL: https://gomez-aviator-collector.onrender.com
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          ALLOWED_SOURCES: gamedata365
        run: npm run sync:gamedata365
