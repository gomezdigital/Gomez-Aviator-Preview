name: GameData365 Aviator live-feed check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe GameData365 live Aviator feed
        working-directory: collector
        env:
          GAMEDATA365_API_KEY: ${{ secrets.GAMEDATA365_API_KEY }}
        run: npm run probe:gamedata365
