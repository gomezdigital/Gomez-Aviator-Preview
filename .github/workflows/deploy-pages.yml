name: Deploy Gomez Aviator Preview to GitHub Pages

on:
  push:
    branches: ["main", "sync/original-intelligence"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage frontend-only site
        run: |
          mkdir -p _site
          cp index.html v2-preview.css v2-preview.js _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
